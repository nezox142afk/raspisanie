name: update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Обновить расписание и отправить сообщение
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROUP: "263-СП"
          SEND_TIME: "20:00"
          TZ_NAME: "Asia/Novokuznetsk"
          PUBLIC_KEY: "https://disk.yandex.ru/d/bbxOH6odZrMXrQ"
          PAGES_URL: "https://nezox142afk.github.io/raspisanie/"
        run: python tools/update.py
      - name: Сохранить архив в репозиторий
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "update schedule"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
